services:
  web:
    # Available resolution tags:
    # - latest, 1600x960 (default resolution)
    # - 2400x1440
    # - 3200x1920
    # OpenHamClock candidate tags are opt-in; see the workflow summary and README.
    image: ghcr.io/chrisromp/hamclock-docker:latest
    # For OpenHamClock candidates only; legacy images use their existing command.
    # environment:
    #   BACKEND_HOST: ohb.hamclock.app:80
    ports:
      - "8080:8080/tcp"
      - "8081:8081/tcp"
      # Uncomment below if you want to expose the read-only web interface on port 8082
      #- "8082:8082/tcp" 
    volumes:
      - data:/root/.hamclock
    restart: unless-stopped

volumes:
  data: