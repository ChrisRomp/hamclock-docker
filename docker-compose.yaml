services:
  web:
    # First run: python3 scripts/ohc_release.py --output ESPHamClock.zip
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # HamClock supported resolutions are 800x480, 1600x960, 2400x1440 and 3200x1920 as of v3.02
        HAMCLOCK_RESOLUTION: 1600x960
    ports:
      - "8080:8080/tcp"
      - "8081:8081/tcp"
    volumes:
      - data:/root/.hamclock
    # environment:
    #   BACKEND_HOST: ohb.hamclock.app:80
    restart: unless-stopped

volumes:
  data:
