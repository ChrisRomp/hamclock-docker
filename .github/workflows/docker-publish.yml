name: Docker Build

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Exact stable OpenHamClock release tag (blank selects latest stable)"
        required: false
        type: string
      publish_stable:
        description: "Promote tested images to stable tags and create a GitHub release"
        default: false
        type: boolean
      candidate_run_id:
        description: "Promote an existing successful run without rebuilding (requires exact tag and publish_stable)"
        required: false
        type: string
  workflow_call:
    inputs:
      upstream_tag:
        required: true
        type: string
      publish_stable:
        default: false
        type: boolean
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: docker-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Test release selection
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Resolve and verify source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          PUBLISH_STABLE: ${{ inputs.publish_stable }}
        run: |
          set -eu
          if [ -n "$CANDIDATE_RUN_ID" ] && { [ -z "$UPSTREAM_TAG" ] || [ "$PUBLISH_STABLE" != true ]; }; then
            echo '::error::Existing candidate promotion requires an exact upstream_tag and publish_stable=true.'
            exit 1
          fi
          if [ -n "$UPSTREAM_TAG" ]; then
            result=$(python3 scripts/ohc_release.py --tag "$UPSTREAM_TAG" --output ESPHamClock.zip)
          else
            result=$(python3 scripts/ohc_release.py --output ESPHamClock.zip)
          fi
          echo "tag=$(echo "$result" | jq -r .tag)" >> "$GITHUB_OUTPUT"
          echo "Source: $result" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: ESPHamClock.zip
          if-no-files-found: error

  build:
    if: inputs.candidate_run_id == ''
    needs: source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        resolution: [1600x960, 2400x1440, 3200x1920]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: source
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.1.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set candidate tag
        id: candidate
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.source.outputs.tag }}
          RESOLUTION: ${{ matrix.resolution }}
        run: |
          image="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "tag=${image}:candidate-${VERSION}-${RESOLUTION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.candidate.outputs.tag }}
          labels: |
            org.opencontainers.image.version=${{ needs.source.outputs.tag }}
          build-args: |
            HAMCLOCK_RESOLUTION=${{ matrix.resolution }}
          cache-from: type=gha,scope=build-${{ matrix.resolution }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.resolution }}
      - uses: sigstore/cosign-installer@v4.1.2
        if: github.event_name != 'pull_request'
      - name: Check and sign candidate index
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.candidate.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          docker buildx imagetools inspect "$TAG" --raw > index.json
          for platform in 'linux/amd64' 'linux/arm64' 'linux/arm/v7'; do
            os=${platform%%/*}
            arch=${platform#*/}
            variant=
            if [ "$arch" = arm/v7 ]; then arch=arm; variant=v7; fi
            jq -e --arg os "$os" --arg arch "$arch" --arg variant "$variant" \
              '[.manifests[] | select(.platform.os == $os and .platform.architecture == $arch and (if $variant == "" then true else .platform.variant == $variant end))] | length == 1' index.json > /dev/null
          done
          cosign sign --yes "${TAG%@*}@${DIGEST}"
          echo "Candidate: \`$TAG\` (\`$DIGEST\`)" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    if: github.event_name != 'pull_request' && inputs.candidate_run_id == ''
    needs: [source, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: [1600x960, 2400x1440, 3200x1920]
        platform: [linux/amd64, linux/arm64, linux/arm/v7]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - name: Install Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/hamclock-playwright" playwright
          "$RUNNER_TEMP/hamclock-playwright/node_modules/.bin/playwright" install --with-deps chromium
          echo "PLAYWRIGHT_NODE_PATH=$RUNNER_TEMP/hamclock-playwright/node_modules" >> "$GITHUB_ENV"
      - name: Probe public backend
        if: matrix.platform == 'linux/amd64'
        run: |
          mkdir -p smoke-artifacts
          if curl -fsS --max-time 15 http://ohb.hamclock.app/ham/HamClock/ssn/ssn-31.txt \
              -o smoke-artifacts/backend-sample.txt 2> smoke-artifacts/backend-error.log \
              && test -s smoke-artifacts/backend-sample.txt; then
            echo 'Public backend returned sample data.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::Public backend sample data was unavailable; see backend-error.log.'
            echo 'Public backend sample data was unavailable.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Smoke test
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.source.outputs.tag }}
          RESOLUTION: ${{ matrix.resolution }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          image="ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          export IMAGE="${image}:candidate-${VERSION}-${RESOLUTION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash scripts/smoke-test.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.resolution }}-${{ strategy.job-index }}
          path: smoke-artifacts/
          if-no-files-found: warn

  publish:
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      inputs.publish_stable && needs.source.result == 'success' &&
      (inputs.candidate_run_id != '' ||
       (needs.build.result == 'success' && needs.smoke.result == 'success'))
    needs: [source, build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: source
      - uses: docker/setup-buildx-action@v4.3.0
      - uses: docker/login-action@v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Promote tested indexes and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source.outputs.tag }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id || github.run_id }}
        run: python3 -m scripts.promote_release --tag "$VERSION" --run-id "$CANDIDATE_RUN_ID"
      - name: Save promotion and rollback digests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: promotion
          path: promotion.json
          if-no-files-found: warn
