name: Check OpenHamClock releases

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Find current releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          stable=$(python3 scripts/ohc_release.py --channel stable)
          beta=$(python3 scripts/ohc_release.py --channel beta)
          {
            echo '## OpenHamClock releases'
            echo "- Stable: $(echo "$stable" | jq -r .tag)"
            echo "- Beta: $(echo "$beta" | jq -r .tag)"
            echo
            echo 'Run Docker Build manually to publish an opt-in candidate. Stable tags are not changed.'
          } >> "$GITHUB_STEP_SUMMARY"
